# Pulls canonical architecture content (diagrams + ELI9 stories) from
# miniforge-ai/miniforge into this site and commits the diff to main —
# Cloudflare Workers Builds then redeploys automatically. This repo
# projects miniforge only; thesium content lives on thesium-marketing.
#
# Triggers:
#   - repository_dispatch [architecture-updated]: sent by the source
#     repo's notify-website.yml when docs/architecture/** changes land
#     on its main.
#   - schedule: daily backstop in case a dispatch is missed.
#   - workflow_dispatch: manual run.

name: Sync content

on:
  repository_dispatch:
    types: [architecture-updated]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    name: Sync diagrams and stories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout miniforge
        uses: actions/checkout@v4
        with:
          repository: miniforge-ai/miniforge
          path: sources/miniforge

      - name: Sync content
        env:
          SYNC_WS: ${{ github.workspace }}/sources
        run: node scripts/sync-diagrams.mjs

      - name: Commit and push if changed
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          PAYLOAD_SOURCE: ${{ github.event.client_payload.source }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha }}
        run: |
          rm -rf sources
          git add -A
          if git diff --cached --quiet; then
            echo "No content changes."
            exit 0
          fi
          git config user.name "miniforge-sync[bot]"
          git config user.email "noreply@miniforge.ai"
          DETAIL="$TRIGGER_EVENT"
          if [ -n "$PAYLOAD_SOURCE" ]; then DETAIL="$DETAIL ($PAYLOAD_SOURCE@$PAYLOAD_SHA)"; fi
          git commit -m "chore: sync architecture content from miniforge" -m "Triggered by: $DETAIL"
          git push
